[project]
name = "farmacia-vecinal"
version = "0.1.0"
description = "Sistema local de inventario y entrega de medicamentos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "SQLAlchemy>=2.0,<3",
]

[project.scripts]
farmacia-vecinal = "farmacia_vecinal.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farmacia_vecinal"]
